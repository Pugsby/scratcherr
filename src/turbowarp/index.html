<!DOCTYPE html>
<!-- Heavily modified version of turbowarp packager's output -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>Project</title>
  <base href="/turbowarp/">
  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    :root, body.is-fullscreen {
      background-color: transparent;
    }
    [hidden] {
      display: none !important;
    }
    h1 {
      font-weight: normal;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    #app, #loading, #error, #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }
    #launch {
      background-color: rgba(0, 0, 0, 0);
      cursor: pointer;
    }
    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .progress-bar-outer {
      height: 5px;
      position: absolute;
      bottom: 0px;
      width: 100%;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }
    #loading::after {
      content: '';
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 100px;
      height: 100px;
      background-image: url(../logo.svg);
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      animation: spin 1s linear 0s infinite;
    }
    @keyframes spin {
      from {transform: rotate(0deg);}
      to {transform: rotate(360deg);}
    }
    .loading-text, noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }
    .loading-image {
      margin: 0 0 16px;
    }
    #error-message, #error-stack {
      font-family: monospace;
      max-width: 600px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    #error-stack {
      text-align: left;
      max-height: 200px;
      overflow: auto;
    }
    .control-button {
      width: 2rem;
      height: 2rem;
      padding: 0.375rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
    }
    .control-button-highlight:hover {
      background: #ff4c4c26;
    }
    .control-button-highlight.active {
      background: #ff4c4c59;
    }
    .fullscreen-button {
      background: white;
    }
    .standalone-fullscreen-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 0 0 0 4px;
      padding: 4px;
      cursor: pointer;
    }
    .sc-canvas {
      cursor: auto;
    }
    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color {
      background-color: #ff8c1a;
    }
    .sc-monitor-row-value-outer {
      background-color: #fc662c;
    }
    .sc-monitor-row-value-editing .sc-monitor-row-value-outer {
      background-color: #e25b27;
    }
    body:has(#loading:not([hidden])) canvas {
      display: none;
    }
  </style>
  <meta name="theme-color" content="#000000">
  
</head>
<body>
  <div id="app"></div>

  <div id="launch" class="screen" hidden title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs><style>.cls-1,.cls-2{fill:#009975;stroke:#00271d;stroke-linecap:round;stroke-linejoin:round;}.cls-2{stroke-width:1.5px;}</style></defs>
        <path class="cls-1" d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0"/>
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75"/>
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    
    
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <script src="script.js"></script>
  <script>
    const appElement = document.getElementById('app');
    const launchScreen = document.getElementById('launch');
    const loadingScreen = document.getElementById('loading');
    const loadingInner = document.getElementById('loading-inner');
    const errorScreen = document.getElementById('error');
    const errorScreenMessage = document.getElementById('error-message');
    const errorScreenStack = document.getElementById('error-stack');

    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = '' + error;
      let debug = error && error.stack || 'no stack';
      debug += '\nUser agent: ' + navigator.userAgent;
      errorScreenStack.textContent = debug;
    };
    const setProgress = (progress) => {
      if (loadingInner) loadingInner.style.width = progress * 100 + '%';
    };
    const interpolate = (a, b, t) => a + t * (b - a);
    const params = new URLSearchParams(location.search);
    const projectPath = params.get('project');
    const innerZipPath = params.get('file');
    const cleanPath = (path) => path.trim().replace(/^['"]|['"]$/g, '');
    let outerZip = null;

    const initialize = async () => {
      try {
      setProgress(0.1);
      if (projectPath || innerZipPath) {
        if (!projectPath || !innerZipPath) {
          throw new Error('Both "project" and "file" URL parameters are required.');
        }
        const outerUrl = new URL(cleanPath(projectPath), location.href);
        const outerResponse = await fetch(outerUrl);
        if (!outerResponse.ok) {
          throw new Error('Request to load outer project ZIP failed: ' + outerResponse.status);
        }
        outerZip = await Scaffolding.JSZip.loadAsync(await outerResponse.arrayBuffer());
        const detailFile = outerZip.file('detail.json');
        if (!detailFile) {
          throw new Error('The outer project ZIP does not contain detail.json.');
        }
        window.settings = await detailFile.async('string');
      } else {
        window.settings = {};
      }
      console.log(settings);
      var settingsJson = JSON.parse(settings).settings;
      var overrides = JSON.parse(settings).files[params.get('file')] || [];
      console.log(overrides);
      for (const [key, value] of Object.entries(overrides)) {
        settingsJson[key] = value;
      }
      const scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = settingsJson.stageSize[0] || 480;
      scaffolding.height = settingsJson.stageSize[1] || 360;
      scaffolding.resizeMode = "preserve-ratio";
      scaffolding.editableLists = false;
      scaffolding.usePackagedRuntime = true;
      scaffolding.setup();
      scaffolding.appendTo(appElement);

      const vm = scaffolding.vm;
      window.scaffolding = scaffolding;
      window.vm = scaffolding.vm;
      window.Scratch = {
        vm,
        renderer: vm.renderer,
        audioEngine: vm.runtime.audioEngine,
        bitmapAdapter: vm.runtime.v2BitmapAdapter,
        videoProvider: vm.runtime.ioDevices.video.provider
      };
      var username = "player####"
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) {
          return parts.pop().split(';').shift();
        }
        return null;
      }
      username = getCookie("username") || username
      scaffolding.setUsername(username.replace(/#/g, () => Math.floor(Math.random() * 10)));
      scaffolding.setAccentColor(settingsJson.accentColor || "#00e2ad");

      try {
        scaffolding.addCloudProvider(new Scaffolding.Cloud.WebSocketProvider(["wss://clouddata.turbowarp.org","wss://clouddata.turbowarp.xyz"], settingsJson.projectId || "scratcherrTest"));
      } catch (error) {
        console.error(error);
      }

      vm.setTurboMode(false);
      if (vm.setInterpolation) vm.setInterpolation(false);
      if (vm.setFramerate) vm.setFramerate(settingsJson.framerate || 30);
      if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
      if (vm.setRuntimeOptions) vm.setRuntimeOptions({
        fencing: (!settingsJson.removeFence) || true,
        miscLimits: (!settingsJson.removeMiscLimit) || true,
        maxClones: settingsJson.maxClones || 300,
      });
      if (vm.setCompilerOptions) vm.setCompilerOptions({
        enabled: (settingsJson.compiler) || true,
        warpTimer: (settingsJson.warpTimer) || false
      });
      if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);

      if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);

      if (typeof ScaffoldingAddons !== 'undefined') {
        ScaffoldingAddons.run(scaffolding, {"gamepad":false,"pointerlock":false,"specialCloudBehaviors":false,"unsafeCloudBehaviors":false,"pause":false}); // I'll implement these later
      }

      scaffolding.setExtensionSecurityManager({
        getSandboxMode: () => 'unsandboxed',
        canLoadExtensionFromProject: () => true
      });
      for (const extension of settingsJson.extensions || []) {
        vm.extensionManager.loadExtensionURL(extension);
      }

      } catch (e) {
        handleError(e);
        throw e;
      }
      const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      if (!settingsJson.greenFlag) {
        scaffolding.start();
      } else {
        launchScreen.hidden = false;
        launchScreen.addEventListener('click', () => {
          launchScreen.hidden = true;
          scaffolding.start();
        });
        launchScreen.focus();
      }
    };
    run().catch(handleError);
    };
    window.initializationPromise = initialize();
  </script>
  
  
    <script>
      const assetUrlMap = new Map();
      const getProjectData = async () => {
        await window.initializationPromise;
        const storage = scaffolding.storage;
        storage.onprogress = (total, loaded) => {
          setProgress(interpolate(0.2, 0.98, total ? loaded / total : 0));
        };
        
        storage.addWebStore(
          [
            storage.AssetType.ImageVector,
            storage.AssetType.ImageBitmap,
            storage.AssetType.Sound,
            storage.AssetType.Font
          ].filter(i => i),
          (asset) => assetUrlMap.get(asset.assetId + '.' + asset.dataFormat) ||
            new URL('./assets/' + asset.assetId + '.' + asset.dataFormat, location).href
        );
        if (projectPath || innerZipPath) {
            const requestedPath = cleanPath(innerZipPath).replace(/^\/+/, '');
            let innerFile = outerZip.file(requestedPath);
            if (!innerFile) {
              const matchingFiles = Object.values(outerZip.files).filter((entry) =>
                !entry.dir && entry.name.endsWith('/' + requestedPath)
              );
              if (matchingFiles.length === 1) {
                innerFile = matchingFiles[0];
              } else if (matchingFiles.length > 1) {
                throw new Error('Multiple inner ZIP files match the requested path: ' + requestedPath);
              }
            }
            if (!innerFile) {
              throw new Error('The requested inner ZIP was not found: ' + requestedPath);
            }
            setProgress(0.15);
            const innerZip = await Scaffolding.JSZip.loadAsync(await innerFile.async('arraybuffer'));
            const projectFile = innerZip.file('project.json');
            if (!projectFile) {
              throw new Error('The inner ZIP does not contain project.json.');
            }
            const projectData = await projectFile.async('arraybuffer');
            const assetFiles = Object.values(innerZip.files).filter((entry) => !entry.dir);
            await Promise.all(assetFiles.map(async (entry, index) => {
              const assetUrl = URL.createObjectURL(await entry.async('blob'));
              assetUrlMap.set(entry.name.split('/').pop(), assetUrl);
              setProgress(interpolate(0.17, 0.2, (index + 1) / assetFiles.length));
            }));
            return projectData;
        }
        return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.onload = () => {
          resolve(xhr.response);
        };
        xhr.onerror = () => {
          if (location.protocol === 'file:') {
            reject(new Error('Zip environment must be used on a website, not on a local file. To fix this error, use the "Plain HTML" environment instead.'));
          } else {
            reject(new Error('Request to load project data failed.'));
          }
        };
        xhr.onprogress = (e) => {
          if (e.lengthComputable) {
            setProgress(interpolate(0.1, 0.2, e.loaded / e.total));
          }
        };
        xhr.responseType = 'arraybuffer';
        xhr.open('GET', "./assets/project.json");
        xhr.send();
      });
      };
    </script>
  <script>
    
  </script>

</body>
</html>
